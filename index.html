<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xilófono Virtual - Academia de Música IEMS</title>
    <link rel="stylesheet" href="style.css?v=11">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🪵 Xilófono Virtual</h1>
            <p class="subtitle">Academia de Música - IEMS</p>
        </header>

        <section class="student-info">
            <input type="email" id="studentEmail" placeholder="Correo electrónico">
            <input type="text" id="studentName" placeholder="Nombre completo">
            <input type="text" id="studentGroup" placeholder="Grupo (ej. 333)">
        </section>

        <section class="controls">
            <button id="btnMode" class="active-mode">🎵 Modo Familiarización</button>
            <button id="btnPlay">▶️ Escuchar</button>
            <button id="btnGenerate">🔄 Nueva Melodía</button>
            <button id="btnCheck">✅ Verificar</button>
            <button id="btnClear">🗑️ Limpiar</button>
        </section>

        <section class="info-panel">
            <div class="info-box">
                <span>Nivel:</span> <strong id="currentLevel">1</strong>
            </div>
            <div class="info-box">
                <span>Notas:</span> <strong id="noteCount">0</strong>
            </div>
            <div class="info-box">
                <span>Racha:</span> <strong id="levelProgress">0/2</strong>
            </div>
        </section>

        <section class="xylophone" id="xylophone">
            <!-- Las barras se generan con JavaScript -->
        </section>

        <section class="feedback-section">
            <div id="feedback" class="feedback">Presiona "Escuchar" para comenzar</div>
            <div id="scoreDisplay" class="score-display" style="display: none;">
                <div class="score-value" id="scoreValue">0</div>
                <div class="score-text" id="feedbackText"></div>
            </div>
        </section>
    </div>

    <script src="app.js?v=11"></script>
</body>
</html>
